[project]
name = "{{cookiecutter.project_name}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
authors = [{ name = "{{cookiecutter.author}}", email = "{{cookiecutter.email}}" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.7.8,<2",
    "black>=24.4.1,<25",
    "commitizen>=3.24.0,<4",
    "coverage>=7.5.0,<8",
    "flake8>=7.0.0,<8",
    "flake8-docstrings>=1.7.0,<2",
    "flake8-isort>=6.1.1,<7",
    "flake8-print>=5.0.0,<6",
    "flake8-typing-imports>=1.15.0,<2",
    "isort>=5.13.2,<6",
    "jupyterlab==3.6.5",
    "jupyterlab-snippets>=0.4.1,<0.5",
    "matplotlib>=3.8.4,<4",
    "memory-profiler>=0.61.0,<0.62",
    "mypy>=1.10.0,<2",
    "nbconvert>=7.16.4,<8",
    "nbqa>=1.8.5,<2",
    "pre-commit>=3.7.0,<4",
    "pre-commit-hooks>=4.6.0,<5",
    "poetry-kernel>=0.1.3,<0.2",
    "pytest>=8.1.1,<9",
    "ruff>=0.4.1,<0.5",
    "streamlit>=1.42.2,<2",
    "toml>=0.10.2,<0.11",
    "types-psutil>=5.9.5.20240423,<6",
]
doc = [
    "mike>=2.0.0,<3",
    "mkdocs>=1.6.0,<2",
    "mkdocs-autorefs>=1.0.1,<2",
    "mkdocs-exporter>=6.0.0,<7",
    "mkdocstrings>=0.25.0,<0.26",
    "mkdocs-material>=9.5.19,<10",
    "mkdocstrings-python>=1.10.0,<2",
    "mkdocs-print-site-plugin>=2.5.0,<3",
    "mkdocs-with-pdf>=0.9.3,<0.10",
]
api = [
    "fastapi[standard]>=0.115.4,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
]
prod = []

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["{{cookiecutter.project_slug}}*"]

[tool.bandit]
exclude_dirs = ["tests", "profiling", "app", "demo", "notebooks"]

[tool.coverage.run]
source = ["{{cookiecutter.project_slug}}/"]
omit = [
    'tests/',
    '/tmp/',
]

[tool.mypy]
pretty = true
no_implicit_optional = true
disable_error_code = "attr-defined"

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true
default_section = "THIRDPARTY"
known_third_party = []
known_first_party = ["{{cookiecutter.project_slug}}"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88 # Longitud máxima de línea permitida
extend-exclude = [
    ".git"
]

[tool.ruff.lint]
select = ["B", "E", "F", "T", "W", "I", "ANN001", "D"]
ignore = ["B008", "D401", "D406", "D407", "D417"] # Lista de códigos a ignorar
fixable = [
    "ALL",
] # Permite correcciones automáticas para todas las reglas habilitadas
unfixable = [] # Lista de códigos que no deben corregirse automáticamente
exclude = [
    ".git",
    "env",
    "templates",
    "app",
] # Directorios excluidos del análisis de linting

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
