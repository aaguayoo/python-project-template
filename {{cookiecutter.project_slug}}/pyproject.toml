[project]
name = "{{cookiecutter.project_name}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
authors = [{ name = "{{cookiecutter.author}}", email = "{{cookiecutter.email}}" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]

[project.scripts]

[dependency-groups]
dev = [
    "anyio>=4.9.0,<5.0.0",
    "bandit>=1.7.8,<2.0.0",
    "black>=26.3.1,<27.0.0",
    "commitizen>=3.24.0,<4.0.0",
    "coverage>=7.5.0,<8.0.0",
    "flake8>=7.0.0,<8.0.0",
    "flake8-docstrings>=1.7.0,<2.0.0",
    "flake8-isort>=6.1.1,<7.0.0",
    "flake8-print>=5.0.0,<6.0.0",
    "flake8-typing-imports>=1.15.0,<2.0.0",
    "git-changelog>=2.5.3,<3.0.0",
    "ipykernel>=7.2.0,<8.0.0",
    "ipywidgets>=8.1.8,<9.0.0",
    "isort>=5.13.2,<6.0.0",
    "jupyterlab>=4.6.1,<5.0.0",
    "jupyterlab-code-formatter>=3.0.3,<4.0.0",
    "matplotlib>=3.8.4,<4.0.0",
    "memory-profiler>=0.61.0,<0.62.0",
    "mypy>=1.15.0,<2.0.0",
    "nbqa>=1.8.5,<2.0.0",
    "pre-commit>=3.7.0,<4.0.0",
    "pre-commit-hooks>=4.6.0,<5.0.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.16.0,<4.0.0",
    "ruff>=0.4.1,<0.5.0",
    "starlette>=0.49.1,<0.50.0",
    "streamlit>=1.55.0,<2.0.0",
    "toml>=0.10.2,<0.11.0",
    "typing-extensions>=4.12.2,<5.0.0",
    "types-psutil>=5.9.5.20240423,<6",
    "uvkernel>=0.2.0",
]
doc = [
    "mike>=2.1.3,<3.0.0",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-autorefs>=1.4.3,<2.0.0",
    "mkdocs-awesome-nave>=3.3.0,<4.0.0",
    "mkdocs-exporter>=6.0.0,<7.0.0",
    "mkdocs-material>=9.7.6,<10.0.0",
    "mkdocs-print-site-plugin>=2.5.0,<3.0.0",
    "mkdocstrings>=0.28.3,<1.0.0",
    "mkdocstrings-python>=1.16.12,<2.0.0",
    "qrcode>=8.2.0,<9.0.0",
]
api = [
    "fastapi[standard]>=0.142.1,<0.143.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
]

[tool.uv]
default-groups = []
package = true

[[tool.uv.index]]

[tool.uv.sources]

[tool.uv.build-backend]
module-root = "."
module-name = "{{cookiecutter.project_slug}}"

[tool.bandit]
exclude_dirs = ["tests", "profiling", "app", "demo", "notebooks"]
skips = ["B301", "B311", "B403", "B608"]

[tool.coverage.run]
source = ["{{cookiecutter.project_slug}}/"]
omit = [
    "tests/",
    "/tmp/",
    "notebooks/*",
    "notebooks/**",
]
command_line = "-m pytest"

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true
default_section = "THIRDPARTY"
known_third_party = []
known_first_party = ["{{cookiecutter.project_slug}}"]

[tool.mypy]
python_version = "3.13"
files = ["{{cookiecutter.project_slug}}"]
strict = false
warn_unused_configs = true
disable_error_code = ["attr-defined", "import-untyped", "union-attr", "call-arg"]

cache_dir = ".mypy_cache"
incremental = true
follow_imports = "skip"
ignore_missing_imports = true

pretty = true
no_implicit_optional = true
disable_error_code = "attr-defined"






[tool.setuptools.packages.find]
include = ["{{cookiecutter.project_slug}}*"]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88 # Longitud máxima de línea permitida
extend-exclude = [
    ".git"
]

[tool.ruff.lint]
select = ["B", "E", "F", "T", "W", "I", "ANN001", "D"]
ignore = ["B008", "D401", "D406", "D407", "D417"] # Lista de códigos a ignorar
fixable = [
    "ALL",
] # Permite correcciones automáticas para todas las reglas habilitadas
unfixable = [] # Lista de códigos que no deben corregirse automáticamente
exclude = [
    ".git",
    "env",
    "templates",
    "app",
] # Directorios excluidos del análisis de linting

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
